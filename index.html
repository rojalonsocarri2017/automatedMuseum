<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>TFG Rodrigo Alonso</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <script src="./components/aframe-lounge.js"></script>
    <script src="./components/star-sky.js"></script>
  </head>

  <body>
    <a-scene antialias="true">


      <a-entity light="type: ambient;
                       color: #ffffff;
                       intensity: 0.3">
      </a-entity>

      <a-entity light="type: ambient;
                       color: #ebd9e9;
                       intensity: 0.2">
      </a-entity>

      <a-entity id="lounge"
        lounge="
          width: 200;
          depth: 300;
          height: 100;
          ceiling: true;
          north: barrier;
          east: wall;
          south: wall;
          west: wall;
          floorTexture: ./assets/wood.jpg;
          wallTexture: ./assets/dark-wood.jpg;
          ceilingTexture: ./assets/dark-wood.jpg;
        ">
      </a-entity>

      <a-entity lounge-entry-point>
        <a-entity
          id="camera1"
          camera
          position="-10 -45.0 20"
          look-controls
          wasd-controls>
        </a-entity>
      </a-entity>


      <a-entity id="screen"
                geometry="primitive: plane"
                material="color: #ffffff"
                position="0 -10.0 -140"
                rotation="0 0 0"
                scale="120 90 1">
      </a-entity>

      <a-entity id="chair_row_1_a"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="-50 -42.0 -50"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-entity id="chair_row_1_b"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="0 -42.0 -50"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-entity id="chair_row_1_c"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="50 -42.0 -50"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-entity id="chair_row_2_a"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="-50 -42.0 -100"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-entity id="chair_row_2_b"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="0 -42.0 -100"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-entity id="chair_row_2_c"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="50 -42.0 -100"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-entity id="chair_row_3_a"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="-50 -42.0 -150"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-entity id="chair_row_3_b"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="0 -42.0 -150"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-entity id="chair_row_3_c"
                gltf-model="./assets/models/furniture/chair_basic.glb"
                position="50 -42.0 -150"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-sky color="#000000"></a-sky>
      <a-entity star-sky></a-entity>

    </a-scene>
  </body>
</html>
