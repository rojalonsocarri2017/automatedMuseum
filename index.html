<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>TFG Rodrigo Alonso</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <script src="./components/aframe-lounge.js"></script>
    <script src="./components/star-sky.js"></script>
  </head>

  <body>
    <a-scene antialias="true">


      <a-entity light="type: ambient;
                       color: #ffffff;
                       intensity: 0.85">
      </a-entity>

      <a-entity light="type: ambient;
                       color: #ebd9e9;
                       intensity: 0.3">
      </a-entity>

      <a-entity id="lounge"
        lounge="
          width: 200;
          depth: 300;
          height: 100;
          ceiling: true;
          north: wall;
          east: glass;
          south: wall;
          west: wall;
          floorTexture: ./assets/floor-texture.jpg;
          wallTexture: ./assets/brick.jpg;
          ceilingTexture: ./assets/jeroglifico.jpg;
        ">
      </a-entity>

      <a-entity lounge-entry-point>
        <a-entity
          id="camera1"
          camera
          position="-10 -45.0 20"
          look-controls
          wasd-controls>
        </a-entity>
      </a-entity>


      <a-entity id="car_display_1"
                gltf-model="./assets/models/vehicles/car_1.glb"
                position="-60 -51.0 -80"
                rotation="0 45 0"
                scale="60 60 60">
      </a-entity>

      <a-entity id="car_display_2"
                gltf-model="./assets/models/vehicles/car_2.glb"
                position="0 -48.8 60"
                rotation="0 90 0"
                scale="250 250 250">
      </a-entity>

      <a-entity id="car_display_3"
                gltf-model="./assets/models/vehicles/car_3.glb"
                position="60 -50.8 -40"
                rotation="0 0 0"
                scale="0.05 0.05 0.05">
      </a-entity>

      <a-sky color="#000000"></a-sky>
      <a-entity star-sky></a-entity>

    </a-scene>
  </body>
</html>
