<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Museo VR</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <script src="./components/aframe-lounge.js"></script>
    <script src="./components/star-sky.js"></script>
  </head>

  <body>
    <a-scene antialias="true">


      <a-entity light="type: ambient;
                       color: #ffffff;
                       intensity: 0.85">
      </a-entity>

      <a-entity light="type: ambient;
                       color: #ebd9e9;
                       intensity: 0.3">
      </a-entity>

      <a-entity id="lounge"
        lounge="
          width: 200;
          depth: 300;
          height: 100;
          ceiling: true;
          north: barrier;
          east: glass;
          south: wall;
          west: wall;
          floorTexture: ./assets/floor-texture.jpg;
          wallTexture: ./assets/jeroglifico.jpg;
          ceilingTexture: ./assets/jeroglifico.jpg;
        ">
      </a-entity>

      <a-entity lounge-entry-point>
        <a-entity
          id="camera1"
          camera
          position="-10 -45.0 20"
          look-controls
          wasd-controls>
        </a-entity>
      </a-entity>


      <a-entity id="snowman_base1"
                geometry="primitive: sphere"
                material="color: #ffffff"
                position="-60 -49.0 -80"
                rotation="0 0 0"
                scale="3 3 3">
      </a-entity>

      <a-entity id="snowman_base2"
                geometry="primitive: sphere"
                material="color: #ffffff"
                position="-60 -45.0 -80"
                rotation="0 0 0"
                scale="3 3 3">
      </a-entity>

      <a-entity id="snowman_head"
                geometry="primitive: sphere"
                material="color: #ffffff"
                position="-60 -41.0 -80"
                rotation="0 0 0"
                scale="3 3 3">
      </a-entity>

      <a-entity id="hat_brim"
                geometry="primitive: cylinder"
                material="color: #000000"
                position="-60 -39.0 -80"
                rotation="0 0 0"
                scale="4 0.5 4">
      </a-entity>

      <a-entity id="hat_top"
                geometry="primitive: cone"
                material="color: #ff0000"
                position="-60 -37.0 -80"
                rotation="0 0 0"
                scale="3 3 3">
      </a-entity>

      <a-entity id="snowman_nose"
                geometry="primitive: cone"
                material="color: #ff8800"
                position="-60 -41.0 -78"
                rotation="0 0 0"
                scale="0.5 0.5 0.5">
      </a-entity>

      <a-entity id="tower_nw"
                geometry="primitive: cylinder"
                material="color: #777777"
                position="-80 -45.0 -130"
                rotation="0 0 0"
                scale="6 10 6">
      </a-entity>

      <a-entity id="tower_ne"
                geometry="primitive: cylinder"
                material="color: #777777"
                position="80 -45.0 -130"
                rotation="0 0 0"
                scale="6 10 6">
      </a-entity>

      <a-entity id="tower_sw"
                geometry="primitive: cylinder"
                material="color: #777777"
                position="-80 -45.0 130"
                rotation="0 0 0"
                scale="6 10 6">
      </a-entity>

      <a-entity id="tower_se"
                geometry="primitive: cylinder"
                material="color: #777777"
                position="80 -45.0 130"
                rotation="0 0 0"
                scale="6 10 6">
      </a-entity>

      <a-entity id="wall_north"
                geometry="primitive: box"
                material="color: #666666"
                position="0 -48.0 -130"
                rotation="0 0 0"
                scale="160 4 4">
      </a-entity>

      <a-entity id="wall_south"
                geometry="primitive: box"
                material="color: #666666"
                position="0 -48.0 130"
                rotation="0 0 0"
                scale="160 4 4">
      </a-entity>

      <a-entity id="wall_east"
                geometry="primitive: box"
                material="color: #666666"
                position="80 -48.0 0"
                rotation="0 0 0"
                scale="4 4 260">
      </a-entity>

      <a-entity id="wall_west"
                geometry="primitive: box"
                material="color: #666666"
                position="-80 -48.0 0"
                rotation="0 0 0"
                scale="4 4 260">
      </a-entity>

      <a-entity id="keep_center"
                geometry="primitive: box"
                material="color: #555555"
                position="0 -47.0 0"
                rotation="0 0 0"
                scale="40 6 40">
      </a-entity>

      <a-entity id="warrior_body"
                geometry="primitive: cylinder"
                material="color: #554433"
                position="-30 -48.0 30"
                rotation="0 0 0"
                scale="3 6 3">
      </a-entity>

      <a-entity id="warrior_head"
                geometry="primitive: sphere"
                material="color: #ffcc99"
                position="-30 -43.0 30"
                rotation="0 0 0"
                scale="2 2 2">
      </a-entity>

      <a-entity id="warrior_spear"
                geometry="primitive: cone"
                material="color: #bbbbbb"
                position="-30 -45.0 34"
                rotation="90 0 0"
                scale="0.5 5 0.5">
      </a-entity>

      <a-entity id="tree_trunk_1"
                geometry="primitive: cylinder"
                material="color: #8b5a2b"
                position="-40 -47.5 -20"
                rotation="0 0 0"
                scale="1 5 1">
      </a-entity>

      <a-entity id="tree_foliage_1"
                geometry="primitive: sphere"
                material="color: #228b22"
                position="-40 -44.0 -20"
                rotation="0 0 0"
                scale="3 3 3">
      </a-entity>

      <a-entity id="tree_trunk_2"
                geometry="primitive: cylinder"
                material="color: #8b5a2b"
                position="20 -47.5 40"
                rotation="0 0 0"
                scale="1 5 1">
      </a-entity>

      <a-entity id="tree_foliage_2"
                geometry="primitive: sphere"
                material="color: #228b22"
                position="20 -44.0 40"
                rotation="0 0 0"
                scale="3 3 3">
      </a-entity>

      <a-entity id="tree_trunk_3"
                geometry="primitive: cylinder"
                material="color: #8b5a2b"
                position="60 -47.5 -50"
                rotation="0 0 0"
                scale="1 5 1">
      </a-entity>

      <a-entity id="tree_foliage_3"
                geometry="primitive: sphere"
                material="color: #228b22"
                position="60 -44.0 -50"
                rotation="0 0 0"
                scale="3 3 3">
      </a-entity>

      <a-entity id="stone_path"
                geometry="primitive: plane"
                material="color: #777777"
                position="0 -49.9 0"
                rotation="-90 0 0"
                scale="30 1 5">
      </a-entity>

      <a-entity id="river"
                geometry="primitive: plane"
                material="color: #4169e1"
                position="0 -49.95 70"
                rotation="-90 0 0"
                scale="40 1 8">
      </a-entity>

      <a-sky color="#000000"></a-sky>
      <a-entity star-sky></a-entity>

    </a-scene>
  </body>
</html>
