<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>TFG Rodrigo Alonso</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <script src="./components/aframe-lounge.js"></script>
    <script src="./components/star-sky.js"></script>
  </head>

  <body>
    <a-scene antialias="true">


      <a-entity light="type: ambient;
                       color: #ffffff;
                       intensity: 0.85">
      </a-entity>

      <a-entity light="type: ambient;
                       color: #ebd9e9;
                       intensity: 0.3">
      </a-entity>

      <a-entity id="lounge"
        lounge="
          width: 200;
          depth: 300;
          height: 100;
          ceiling: true;
          north: barrier;
          east: glass;
          south: wall;
          west: wall;
          floorTexture: ./assets/floor-texture.jpg;
          wallTexture: ./assets/jeroglifico.jpg;
          ceilingTexture: ./assets/jeroglifico.jpg;
        ">
      </a-entity>

      <a-entity lounge-entry-point>
        <a-entity
          id="camera1"
          camera
          position="-10 -45.0 20"
          look-controls
          wasd-controls>
        </a-entity>
      </a-entity>


      <a-entity id="river_plane"
                geometry="primitive: plane"
                material="color: #4da6ff"
                position="0 -49.95 0"
                rotation="-90 0 0"
                scale="180 30 1">
      </a-entity>

      <a-entity id="tree_1_trunk"
                geometry="primitive: cylinder"
                material="color: #8b5a2b"
                position="-80 -49.0 -100"
                rotation="0 0 0"
                scale="2 8 2">
      </a-entity>

      <a-entity id="tree_1_foliage"
                geometry="primitive: cone"
                material="color: #2e8b57"
                position="-80 -44.0 -100"
                rotation="0 0 0"
                scale="6 8 6">
      </a-entity>

      <a-entity id="tree_2_trunk"
                geometry="primitive: cylinder"
                material="color: #8b5a2b"
                position="60 -49.0 -120"
                rotation="0 0 0"
                scale="2 10 2">
      </a-entity>

      <a-entity id="tree_2_foliage"
                geometry="primitive: cone"
                material="color: #2e8b57"
                position="60 -43.0 -120"
                rotation="0 0 0"
                scale="7 10 7">
      </a-entity>

      <a-entity id="tree_3_trunk"
                geometry="primitive: cylinder"
                material="color: #8b5a2b"
                position="-30 -49.0 100"
                rotation="0 0 0"
                scale="2 9 2">
      </a-entity>

      <a-entity id="tree_3_foliage"
                geometry="primitive: cone"
                material="color: #2e8b57"
                position="-30 -44.0 100"
                rotation="0 0 0"
                scale="6 9 6">
      </a-entity>

      <a-entity id="tree_4_trunk"
                geometry="primitive: cylinder"
                material="color: #8b5a2b"
                position="90 -49.0 80"
                rotation="0 0 0"
                scale="2 7 2">
      </a-entity>

      <a-entity id="tree_4_foliage"
                geometry="primitive: cone"
                material="color: #2e8b57"
                position="90 -45.0 80"
                rotation="0 0 0"
                scale="5 7 5">
      </a-entity>

      <a-entity id="tree_5_trunk"
                geometry="primitive: cylinder"
                material="color: #8b5a2b"
                position="-70 -49.0 50"
                rotation="0 0 0"
                scale="2 8 2">
      </a-entity>

      <a-entity id="tree_5_foliage"
                geometry="primitive: cone"
                material="color: #2e8b57"
                position="-70 -44.0 50"
                rotation="0 0 0"
                scale="6 8 6">
      </a-entity>

      <a-entity id="stone_1"
                geometry="primitive: box"
                material="color: #7f7f7f"
                position="-40 -49.5 -5"
                rotation="0 0 0"
                scale="2 1 2">
      </a-entity>

      <a-entity id="stone_2"
                geometry="primitive: box"
                material="color: #7f7f7f"
                position="0 -49.5 -5"
                rotation="0 0 0"
                scale="2 1 2">
      </a-entity>

      <a-entity id="stone_3"
                geometry="primitive: box"
                material="color: #7f7f7f"
                position="40 -49.5 -5"
                rotation="0 0 0"
                scale="2 1 2">
      </a-entity>

      <a-entity id="stone_4"
                geometry="primitive: box"
                material="color: #7f7f7f"
                position="-20 -49.5 5"
                rotation="0 0 0"
                scale="2 1 2">
      </a-entity>

      <a-entity id="stone_5"
                geometry="primitive: box"
                material="color: #7f7f7f"
                position="20 -49.5 5"
                rotation="0 0 0"
                scale="2 1 2">
      </a-entity>

      <a-entity id="sailboat_hull"
                geometry="primitive: box"
                material="color: #663300"
                position="30 -49.95 0"
                rotation="0 0 0"
                scale="12 2 4">
      </a-entity>

      <a-entity id="sailboat_mast"
                geometry="primitive: cylinder"
                material="color: #996633"
                position="30 -48.0 0"
                rotation="0 0 0"
                scale="0.5 8 0.5">
      </a-entity>

      <a-entity id="sailboat_sail"
                geometry="primitive: plane"
                material="color: #ffffff"
                position="30 -45.0 0"
                rotation="0 0 0"
                scale="6 10 1">
      </a-entity>

      <a-sky color="#000000"></a-sky>
      <a-entity star-sky></a-entity>

    </a-scene>
  </body>
</html>
