<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>TFG Rodrigo Alonso</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <script src="./components/aframe-lounge.js"></script>
    <script src="./components/star-sky.js"></script>
  </head>

  <body>
    <a-scene antialias="true">


      <a-entity light="type: ambient;
                       color: #ffffff;
                       intensity: 0.85">
      </a-entity>

      <a-entity light="type: ambient;
                       color: #ebd9e9;
                       intensity: 0.3">
      </a-entity>

      <a-entity id="lounge"
        lounge="
          width: 50;
          depth: 50;
          height: 50;
          ceiling: true;
          north: barrier;
          east: glass;
          south: wall;
          west: wall;
          floorTexture: ./assets/floor-texture.jpg;
          wallTexture: ./assets/jeroglifico.jpg;
          ceilingTexture: ./assets/jeroglifico.jpg;
        ">
      </a-entity>

      <a-entity lounge-entry-point>
        <a-entity
          id="camera1"
          camera
          position="-10 -20.0 20"
          look-controls
          wasd-controls>
        </a-entity>
      </a-entity>


      <a-entity id="river"
                geometry="primitive: plane"
                material="color: #4a90e2"
                position="0 -24.95 0"
                rotation="-90 0 0"
                scale="30 20 1">
      </a-entity>

      <a-entity id="tree_1"
                geometry="primitive: cone"
                material="color: #228B22"
                position="-12 -25.0 -10"
                rotation="0 0 0"
                scale="2 4 2">
      </a-entity>

      <a-entity id="tree_2"
                geometry="primitive: cone"
                material="color: #228B22"
                position="-6 -25.0 -10"
                rotation="0 0 0"
                scale="2 4 2">
      </a-entity>

      <a-entity id="tree_3"
                geometry="primitive: cone"
                material="color: #228B22"
                position="0 -25.0 -10"
                rotation="0 0 0"
                scale="2 4 2">
      </a-entity>

      <a-entity id="tree_4"
                geometry="primitive: cone"
                material="color: #228B22"
                position="6 -25.0 -10"
                rotation="0 0 0"
                scale="2 4 2">
      </a-entity>

      <a-entity id="tree_5"
                geometry="primitive: cone"
                material="color: #228B22"
                position="12 -25.0 -10"
                rotation="0 0 0"
                scale="2 4 2">
      </a-entity>

      <a-entity id="stone_1"
                geometry="primitive: box"
                material="color: #8B4513"
                position="-12 -25.0 12"
                rotation="0 0 0"
                scale="1 1 1">
      </a-entity>

      <a-sky color="#000000"></a-sky>
      <a-entity star-sky></a-entity>

    </a-scene>
  </body>
</html>
