        'y': 45
        z: 0
      scale:
        x: 1
        'y': 1
        z: 1
    - name: car_display_2
      model: car_2
      position:
        x: 0
        'y': 0
        z: 60
      rotation:
        x: 0
        'y': 90
        z: 0
      scale:
        x: 1
        'y': 1
        z: 1
    - name: car_display_3
      model: car_3
      position:
        x: 60
        'y': 0
        z: -40
      rotation:
        x: 0
        'y': 0
        z: 0
